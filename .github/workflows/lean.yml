name: Verify Sawin theorem

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sawin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library-procgroups:
    name: ProCGroups
    if: github.event.repository.private == false
    uses: ./.github/workflows/build-library.yml
    with:
      library: ProCGroups

  library-valuedfieldtheory:
    name: ValuedFieldTheory
    if: github.event.repository.private == false
    needs: library-procgroups
    uses: ./.github/workflows/build-library.yml
    with:
      library: ValuedFieldTheory

  library-galoiscohomology:
    name: GaloisCohomology
    if: github.event.repository.private == false
    needs: library-valuedfieldtheory
    uses: ./.github/workflows/build-library.yml
    with:
      library: GaloisCohomology

  library-schemetheory:
    name: SchemeTheory
    if: github.event.repository.private == false
    needs: library-galoiscohomology
    uses: ./.github/workflows/build-library.yml
    with:
      library: SchemeTheory

  library-classfieldtheory-algebra:
    name: ClassFieldTheory.Algebra
    if: github.event.repository.private == false
    needs: library-schemetheory
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.Algebra

  library-classfieldtheory-abstractclassfieldtheory:
    name: ClassFieldTheory.AbstractClassFieldTheory
    if: github.event.repository.private == false
    needs: library-classfieldtheory-algebra
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.AbstractClassFieldTheory

  library-classfieldtheory-localfieldtheory:
    name: ClassFieldTheory.LocalFieldTheory
    if: github.event.repository.private == false
    needs: library-classfieldtheory-abstractclassfieldtheory
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.LocalFieldTheory

  library-classfieldtheory-ramificationtheory:
    name: ClassFieldTheory.RamificationTheory
    if: github.event.repository.private == false
    needs: library-classfieldtheory-localfieldtheory
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.RamificationTheory

  library-classfieldtheory-lubintate:
    name: ClassFieldTheory.LubinTate
    if: github.event.repository.private == false
    needs: library-classfieldtheory-ramificationtheory
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.LubinTate

  library-classfieldtheory-algebraicnumbertheory:
    name: ClassFieldTheory.AlgebraicNumberTheory
    if: github.event.repository.private == false
    needs: library-classfieldtheory-lubintate
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.AlgebraicNumberTheory

  library-classfieldtheory-algebraicfunctionfieldtheory:
    name: ClassFieldTheory.AlgebraicFunctionFieldTheory
    if: github.event.repository.private == false
    needs: library-classfieldtheory-algebraicnumbertheory
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.AlgebraicFunctionFieldTheory

  library-classfieldtheory-kummertheory:
    name: ClassFieldTheory.KummerTheory
    if: github.event.repository.private == false
    needs: library-classfieldtheory-algebraicfunctionfieldtheory
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.KummerTheory

  library-classfieldtheory-localclassfieldtheory-classformation:
    name: ClassFieldTheory.LocalClassFieldTheory.ClassFormation
    if: github.event.repository.private == false
    needs: library-classfieldtheory-kummertheory
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.LocalClassFieldTheory.ClassFormation

  library-classfieldtheory-localclassfieldtheory-lubintateapplication:
    name: ClassFieldTheory.LocalClassFieldTheory.LubinTateApplication
    if: github.event.repository.private == false
    needs: library-classfieldtheory-localclassfieldtheory-classformation
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.LocalClassFieldTheory.LubinTateApplication

  library-classfieldtheory-localclassfieldtheory-finite:
    name: ClassFieldTheory.LocalClassFieldTheory.Finite
    if: github.event.repository.private == false
    needs: library-classfieldtheory-localclassfieldtheory-lubintateapplication
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.LocalClassFieldTheory.Finite

  library-classfieldtheory-localclassfieldtheory:
    name: ClassFieldTheory.LocalClassFieldTheory
    if: github.event.repository.private == false
    needs: library-classfieldtheory-localclassfieldtheory-finite
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.LocalClassFieldTheory

  library-classfieldtheory-globalclassfieldtheory:
    name: ClassFieldTheory.GlobalClassFieldTheory
    if: github.event.repository.private == false
    needs: library-classfieldtheory-localclassfieldtheory
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.GlobalClassFieldTheory

  library-classfieldtheory-kroneckerweber:
    name: ClassFieldTheory.KroneckerWeber
    if: github.event.repository.private == false
    needs: library-classfieldtheory-globalclassfieldtheory
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory.KroneckerWeber

  library-classfieldtheory:
    name: ClassFieldTheory
    if: github.event.repository.private == false
    needs: library-classfieldtheory-kroneckerweber
    uses: ./.github/workflows/build-library.yml
    with:
      library: ClassFieldTheory

  library-sawintotallyrealtowers:
    name: SawinTotallyRealTowers
    if: github.event.repository.private == false
    needs: library-classfieldtheory
    uses: ./.github/workflows/build-library.yml
    with:
      library: SawinTotallyRealTowers

  library-entrypoint:
    name: EntryPoint
    if: github.event.repository.private == false
    needs: library-sawintotallyrealtowers
    uses: ./.github/workflows/build-library.yml
    with:
      library: EntryPoint

  verify:
    if: github.event.repository.private == false
    needs: [library-procgroups, library-valuedfieldtheory, library-galoiscohomology, library-schemetheory, library-classfieldtheory-algebra, library-classfieldtheory-abstractclassfieldtheory, library-classfieldtheory-localfieldtheory, library-classfieldtheory-ramificationtheory, library-classfieldtheory-lubintate, library-classfieldtheory-algebraicnumbertheory, library-classfieldtheory-algebraicfunctionfieldtheory, library-classfieldtheory-kummertheory, library-classfieldtheory-localclassfieldtheory-classformation, library-classfieldtheory-localclassfieldtheory-lubintateapplication, library-classfieldtheory-localclassfieldtheory-finite, library-classfieldtheory-localclassfieldtheory, library-classfieldtheory-globalclassfieldtheory, library-classfieldtheory-kroneckerweber, library-classfieldtheory, library-sawintotallyrealtowers, library-entrypoint]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit the full physical source manifest and SHA-pinned closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verification"
          python3 -B .github/verification/generate_manifest.py \
            --root . --config .github/verification/manifest-config.json \
            --manifest "$RUNNER_TEMP/verification/modules.json" \
            --report "$RUNNER_TEMP/verification/source-audit.json" \
            2>&1 | tee "$RUNNER_TEMP/verification/source-audit.log"
          python3 -B .github/verification/check_source_closure.py \
            --generated-manifest "$RUNNER_TEMP/verification/modules.json" \
            --output "$RUNNER_TEMP/verification/pinned-closure-audit.json" \
            2>&1 | tee "$RUNNER_TEMP/verification/pinned-closure-audit.log"
      - name: Install pinned Lean and obtain only the pinned Mathlib cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Restore completed project outputs from the library jobs
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            .lake/build/lib/lean
            .lake/build/ir/**/*.c
            .lake/build/ir/**/*.c.hash
            .lake/build/ir/**/*.bc
            .lake/build/ir/**/*.bc.hash
            ${{ runner.temp }}/project-build-cache.json
          key: lean-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-verify-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lean-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-
            lean-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
      - name: Validate cached output integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/verification/project_cache.py restore \
            --metadata "$RUNNER_TEMP/project-build-cache.json" \
            --report "$RUNNER_TEMP/verification/cache-restore.json"
      - name: Build exact independent checker revisions
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/verification/setup_tools.py \
            --checkouts "$RUNNER_TEMP/verification-tools" \
            --output "$RUNNER_TEMP/verification/setup"
      - name: Rehashed build, exact targets, declaration audit, NanoDa and official kernel replay
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/verification/verify.py \
            --output "$RUNNER_TEMP/verification/checks" \
            --exporter-checkout "$RUNNER_TEMP/verification-tools/lean4export" \
            --nanoda-checkout "$RUNNER_TEMP/verification-tools/nanoda_lib" \
            --nanoda-binary "$RUNNER_TEMP/verification-tools/nanoda_lib/target/release/nanoda_bin" \
            2>&1 | tee "$RUNNER_TEMP/verification/checks.log"
      - name: Check designated main declarations in the audited inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/verification/check_main_declarations.py \
            --contract .github/verification/main-declarations.json \
            --verification "$RUNNER_TEMP/verification/checks" \
            --output "$RUNNER_TEMP/verification/main-declarations.json"
      - name: Check whitespace
        run: git diff-tree --check --root -r HEAD
      - name: Preserve logs, complete inventories and receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/verification/
            !${{ runner.temp }}/verification/checks/selected.ndjson
          if-no-files-found: error
          retention-days: 14

  publish-cache:
    name: Publish verified proof cache
    needs: verify
    if: github.event.repository.private == false && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ./.github/workflows/cache-release.yml
    with:
      cache-kind: legacy
