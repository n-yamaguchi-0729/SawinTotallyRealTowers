name = "SawinTotallyRealTowers"
version = "1.0.0"
defaultTargets = ["SawinTotallyRealTowers.All", "SawinTotallyRealTowers.MartinetCorollary"]
enableArtifactCache = false
restoreAllArtifacts = false

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
linter.unusedVariables = true
linter.missingDocs = true
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

[[lean_lib]]
name = "ProCGroups"
srcDir = "Lean4"
roots = []
globs = ["ProCGroups.+"]

[[lean_lib]]
name = "ValuedFieldTheory"
srcDir = "Lean4"
roots = []
globs = ["ValuedFieldTheory.+"]
[[lean_lib]]
name = "GaloisCohomology"
srcDir = "Lean4"
roots = []
globs = ["GaloisCohomology.+"]

[[lean_lib]]
name = "ClassFieldTheory"
srcDir = "Lean4"
roots = []
globs = ["ClassFieldTheory.+"]

[[lean_lib]]
name = "SawinTotallyRealTowers"
srcDir = "Lean4"
roots = []
globs = ["SawinTotallyRealTowers.+"]
