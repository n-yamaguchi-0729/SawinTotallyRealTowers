enableArtifactCache = false

name = "Nyll"
version = "0.1.0-dev"
buildDir = ".lake/build"
keywords = ["math"]
defaultTargets = ["Nyll"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
linter.unusedVariables = true
linter.missingDocs = true
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

# All sources share one library configuration and the package-wide checks.
[[lean_lib]]
name = "Nyll"
# Performance-only compiler threads; excluded from incremental build hashes.
weakLeanArgs = ["-j1"]
globs = [
  "Nyll.All",
  "Nyll",
  "Nyll.ProCGroups.+",
  "Nyll.ValuedFieldTheory.+",
  "Nyll.GaloisCohomology.+",
  "Nyll.SchemeTheory.+",
  "Nyll.ClassFieldTheory.+",
  "Nyll.SawinTotallyRealTowers.+",
]
